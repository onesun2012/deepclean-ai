name: Windows regression
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile app.py safety.py
      - run: python tests/test_rules.py
      - run: python tests/test_http.py
      - run: python tests/test_recycle.py
      - run: python tests/test_safety.py
      - run: python tests/test_permanent.py
      - run: python tests/test_sandbox.py
      - run: python tests/test_lifecycle.py
